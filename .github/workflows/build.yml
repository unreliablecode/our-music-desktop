name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build OurMusic.slnx -c Release
      - name: Smoke checks
        run: dotnet run --project tests/OurMusic.SmokeTests -c Release --no-build -- --skip-audio
